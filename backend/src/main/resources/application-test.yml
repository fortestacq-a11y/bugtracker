# Test profile. Decision: tests never touch the real MySQL container — they use an
# in-memory H2 in MySQL compatibility mode, so `mvn test` is self-contained.
# The JWT secret is fixed here so tokens are reproducible between test runs.
spring:
  datasource:
    url: jdbc:h2:mem:bugtracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-secret-0123456789abcdefghijklmnopqrstuvwxyz-test
    ttl-hours: 1

logging:
  level:
    com.example.bugtracker: INFO
    org.hibernate.SQL: WARN