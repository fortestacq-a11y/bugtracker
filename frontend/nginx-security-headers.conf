# Security headers, kept in one place on purpose.
#
# Why a separate file: nginx's add_header does NOT merge across levels. An add_header
# in a location block REPLACES every add_header inherited from the server block. So
# writing `add_header Cache-Control` inside `location /assets/` silently deletes the
# CSP and X-Frame-Options set at server level — headers that are easy to lose and
# never notice, because the cache header still looks correct.
#
# Every location that sets its own headers must therefore `include` this file too.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options    "nosniff"                                 always;
add_header X-Frame-Options           "DENY"                                    always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"         always;