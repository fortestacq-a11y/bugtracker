# BugTracker — full stack in containers.
#
#   podman compose up -d --build        # or: docker compose up -d --build
#   podman compose logs -f api
#   podman compose down                 # stop, keep data
#   podman compose down -v              # stop, DELETE the MySQL volume
#
# Mirrors scripts/db-up.sh deliberately: same MySQL image, same credentials, same
# named volume (bugtracker-mysql-data). Data written by the script is visible here
# and vice-versa, so switching between "run on the host" and "run in compose" never
# loses data.
#
# Frontend  http://localhost:5173   (nginx serving the built bundle)
# API       http://localhost:8080/api/health

name: bugtracker

services:
  db:
    image: docker.io/library/mysql:8.4
    container_name: bugtracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bugtracker
      MYSQL_USER: buguser
      MYSQL_PASSWORD: bugpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      # Exposed so `podman exec bugtracker-mysql mysql -ubuguser ...` still works,
      # matching the README's verification step.
      - "3306:3306"
    volumes:
      - bugtracker-mysql-data:/var/lib/mysql
    healthcheck:
      # The real readiness signal for MySQL: the server is up AND accepting the
      # app user's credentials. `mysqladmin ping` alone succeeds while the first-boot
      # initialisation is still running, which would start the API too early.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ubuguser -pbugpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: localhost/bugtracker-api:dev
    container_name: bugtracker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Service name on the compose network — this is why application.yml reads these
      # from the environment instead of hardcoding localhost. Override DB_HOST in .env
      # to point at a MySQL that lives outside this compose project.
      # Three ways to point at the database, highest priority first:
      #   1. DB_URL set outright (full control, e.g. a managed DB)
      #   2. DB_HOST/DB_PORT/DB_NAME  — compose, and Railway's MYSQL* variables
      #   3. localhost               — plain `mvn spring-boot:run`
      DB_URL: "jdbc:mysql://${DB_HOST:-${MYSQLHOST:-db}}:${DB_PORT:-${MYSQLPORT:-3306}}/${DB_NAME:-${MYSQLDATABASE:-bugtracker}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      # Credentials follow the same chain, so referencing Railway's MySQL variables
      # needs no extra mapping.
      DB_USER: ${DB_USER:-${MYSQLUSER:-buguser}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQLPASSWORD:-bugpass}}
      # Wired through so `web` can build its proxy target from the same value.
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Required, no default — deliberately. `${VAR:?msg}` makes compose refuse to
      # start with an actionable message rather than booting with a signing key that
      # is published in this repo. Put JWT_SECRET in .env (see .env.example) or
      # export it before running compose.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, or run: export JWT_SECRET="$(openssl rand -base64 48)"}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: localhost/bugtracker-web:dev
    container_name: bugtracker-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # nginx proxies /api here. Must be the compose service name, not localhost —
      # localhost inside the web container is the web container.
      API_UPSTREAM: http://api:${SERVER_PORT:-8080}
    ports:
      - "5173:80"

volumes:
  bugtracker-mysql-data:
    name: bugtracker-mysql-data